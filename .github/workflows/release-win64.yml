# .github/workflows/release-win64.yml
name: Publish next win64 legacy NVENC release

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: write

concurrency:
  group: ffmpeg-win64-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish next missing release
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      NV_CODEC_HEADERS_TAG: n13.0.19.1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Select next missing official version
        id: next
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t versions < <(bash scripts/list-ffmpeg-versions.sh config/project.env)
          if (( ${#versions[@]} == 0 )); then
            echo 'No eligible FFmpeg versions found.'
            echo 'found=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for version in "${versions[@]}"; do
            release_tag="v${version}-nv13.0-r1"
            if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Already published: $release_tag"
              continue
            fi
            echo "Next missing release: $release_tag"
            echo 'found=true' >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
            exit 0
          done
          echo 'All eligible FFmpeg versions are already published.'
          echo 'found=false' >> "$GITHUB_OUTPUT"

      - name: Reclaim hosted-runner disk space
        if: steps.next.outputs.found == 'true'
        shell: bash
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true
          if [[ -n "${AGENT_TOOLSDIRECTORY:-}" ]]; then
            sudo rm -rf "$AGENT_TOOLSDIRECTORY" || true
          fi
          docker system prune -af || true
          df -h /

      - name: Build next missing release
        if: steps.next.outputs.found == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-logs out
          /usr/bin/time -v -o "release-logs/time-${VERSION}.txt" \
            bash scripts/build-win64.sh "$VERSION" auto \
            2>&1 | tee "release-logs/build-${VERSION}.log"
          asset="ffmpeg-${VERSION}-win64-gpl-nvenc13.0.zip"
          test -s "out/$asset"
          test -s "out/$asset.sha256"
          (cd out && sha256sum -c "$asset.sha256")

      - name: Publish next missing release
        if: steps.next.outputs.found == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.next.outputs.version }}
          RELEASE_TAG: ${{ steps.next.outputs.release_tag }}
        run: |
          set -euo pipefail
          asset="ffmpeg-${VERSION}-win64-gpl-nvenc13.0.zip"
          cat > "release-logs/notes-${VERSION}.md" <<EOF
          Windows x86_64 static GPL build of official FFmpeg **n${VERSION}** for NVIDIA systems that must remain on legacy driver branches.

          - FFmpeg upstream tag: \`n${VERSION}\`
          - nv-codec-headers: \`n13.0.19.1\`
          - NVENC API: **13.0**
          - Target: Windows x86_64
          - Variant: GPL static
          - Project revision: r1

          Exact upstream commits and the BtbN container digest are recorded inside \`BUILD-INFO.txt\` in the ZIP.
          EOF
          gh release create "$RELEASE_TAG" \
            "out/$asset" \
            "out/$asset.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "FFmpeg ${VERSION} legacy NVENC 13.0 r1" \
            --notes-file "release-logs/notes-${VERSION}.md"

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Legacy release scan'
            echo
            if [[ "${{ steps.next.outputs.found }}" == 'true' ]]; then
              echo '- Selected version: `${{ steps.next.outputs.version }}`'
              echo '- Release tag: `${{ steps.next.outputs.release_tag }}`'
              echo '- Exactly one version was processed in this run.'
            else
              echo '- No missing eligible release was found.'
            fi
            echo '- nv-codec-headers: `n13.0.19.1`'
          } >> "$GITHUB_STEP_SUMMARY"
